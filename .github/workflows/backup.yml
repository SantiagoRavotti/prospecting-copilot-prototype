# Weekly encrypted Postgres backup (Supabase free tier has no automatic backups).
#
# Required repo secrets:
#   SUPABASE_DB_URL     — the direct Postgres connection string
#                         (Dashboard → Settings → Database → Connection string / URI)
#   BACKUP_PASSPHRASE   — symmetric passphrase; KEEP IT SAFE, without it the
#                         backup is unrecoverable.
#
# Restore drill (run locally):
#   openssl enc -d -aes-256-cbc -pbkdf2 -in backup.sql.enc -out backup.sql \
#     -pass pass:"$BACKUP_PASSPHRASE"
#   psql "$TARGET_DB_URL" -f backup.sql

name: Weekly encrypted DB backup

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public \
            -f backup.sql
          echo "Dump size: $(du -h backup.sql | cut -f1)"

      - name: Encrypt (AES-256, PBKDF2)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.sql -out "backup-$(date +%F).sql.enc" \
            -pass pass:"$PASSPHRASE"
          shred -u backup.sql

      - name: Upload encrypted artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.enc
          retention-days: 90
          if-no-files-found: error
