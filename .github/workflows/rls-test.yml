# Cross-tenant isolation test against a throwaway local Supabase stack.
# Runs the migrations, spins up supabase start (Docker), and executes the
# e2e-db suite with the local anon/service keys. No production secrets used.

name: RLS isolation tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: native WebSocket, required by supabase-js realtime in Node.
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations)
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local stack credentials
        run: |
          # `status -o env` emits quoted assignments (VAR="value"); source them
          # so the quotes are interpreted instead of leaking into the values.
          supabase status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          set +a
          {
            echo "SUPABASE_TEST_URL=${API_URL:-${SUPABASE_URL:-}}"
            echo "SUPABASE_TEST_ANON_KEY=${ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
            echo "SUPABASE_TEST_SERVICE_KEY=${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          } >> "$GITHUB_ENV"
          echo "URL exported: ${API_URL:-${SUPABASE_URL:-MISSING}}"

      - name: Run RLS integration suite
        run: npm run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
